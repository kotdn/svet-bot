name: svet

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svet
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Проверить график
        run: python3 check.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROUP: "6.1"
          LEAD_MIN: "30"

      - name: Сохранить состояние
        run: |
          git config user.name "svet-bot"
          git config user.email "svet-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
